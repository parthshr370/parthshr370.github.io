<!-- Preconnect for performance -->
<link rel="preconnect" href="https://www.googletagmanager.com">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://unpkg.com">

<!-- RSS Feed -->
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3S1VYH0FL7"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-3S1VYH0FL7');
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ page.title | default: site.title }}</title>

<!-- SEO -->
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="author" content="{{ site.author }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Open Graph -->
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
{% if page.image %}
<meta property="og:image" content="{{ page.image | absolute_url }}">
{% else %}
<meta property="og:image" content="{{ '/assets/img/banner.jpg' | absolute_url }}">
{% endif %}
{% if page.layout == 'post' %}
<meta property="og:type" content="article">
<meta property="article:author" content="{{ site.author }}">
{% else %}
<meta property="og:type" content="website">
{% endif %}

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@{{ site.twitter_handle }}">
<meta name="twitter:creator" content="@{{ site.twitter_handle }}">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
{% if page.image %}
<meta name="twitter:image" content="{{ page.image | absolute_url }}">
{% else %}
<meta name="twitter:image" content="{{ '/assets/img/banner.jpg' | absolute_url }}">
{% endif %}

<!-- JSON-LD Structured Data for Blog Posts -->
{% if page.layout == 'post' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: site.description | jsonify }},
  "author": {
    "@type": "Person",
    "name": "{{ site.author }}",
    "url": "{{ site.url }}"
  },
  "url": "{{ page.url | absolute_url }}",
  {% if page.image %}"image": "{{ page.image | absolute_url }}",{% endif %}
  "datePublished": "{{ page.date_display }}",
  "publisher": {
    "@type": "Person",
    "name": "{{ site.author }}"
  }
}
</script>
{% endif %}

<script src="https://unpkg.com/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="shortcut icon" href="{{ '/assets/img/favicon.png' | relative_url }}" type="image/png">
{% if page.prism %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-none.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
{% for lang in page.prism %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-{{ lang }}.min.js"></script>
{% endfor %}
{% endif %}
<script>
  // Theme management
  const theme = localStorage.getItem('theme') || 'orange';
  document.documentElement.setAttribute('data-theme', theme);

  function updateThemeIcon(currentTheme) {
    const moonIcon = document.getElementById('moon-icon');
    const sunIcon = document.getElementById('sun-icon');
    if (currentTheme === 'orange') {
      moonIcon?.classList.add('hidden');
      sunIcon?.classList.remove('hidden');
    } else {
      sunIcon?.classList.add('hidden');
      moonIcon?.classList.remove('hidden');
    }
  }

  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'mocha' ? 'orange' : 'mocha';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    updateThemeIcon(newTheme);
  }

  window.addEventListener('DOMContentLoaded', () => {
    updateThemeIcon(document.documentElement.getAttribute('data-theme'));
  });
</script>
