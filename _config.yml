title: Parth Sharma
description: "Building agents, tooling, and writing about it. Go Agent SDK, agentic frameworks, and systems engineering."
url: "https://parthshr370.github.io"
baseurl: ""
author: Parth Sharma
twitter_handle: parthshr370
github_handle: parthshr370

# Build settings
markdown: kramdown
permalink: pretty

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - COLORSCHEME.md
  - ORANGE_THEME.md
  - skills
  - excalidraw.log
  - node_modules
  - vendor

# Collections for blog posts (using pages instead of _posts for URL control)
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
